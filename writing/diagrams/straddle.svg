<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="system-ui, sans-serif" font-size="13">
  <!-- a pin whose 500 m circle straddles two named areas: filed under the one holding the larger share, charged only the population inside it -->
  <rect x="20" y="30" width="270" height="180" fill="#cfe3f5" fill-opacity="0.45" stroke="#3b6ea5"/>
  <rect x="290" y="30" width="290" height="180" fill="#f5e6c8" fill-opacity="0.5" stroke="#b8860b"/>
  <text x="40" y="52" fill="#1f3a5a" font-weight="600">Area A (a town)</text>
  <text x="310" y="52" fill="#7a5a00" font-weight="600">Area B ("Around …", the countryside)</text>
  <line x1="290" y1="30" x2="290" y2="210" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="265" cy="125" r="70" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M265 100 l-8 16 a8 8 0 1 0 16 0 z" fill="#c0392b"/>
  <!-- centroids: 3 in A (dark blue), 2 in B (dark gold) -->
  <g fill="#1f3a5a"><circle cx="225" cy="110" r="5"/><circle cx="240" cy="160" r="5"/><circle cx="270" cy="85" r="5"/></g>
  <g fill="#7a5a00"><circle cx="310" cy="140" r="5"/><circle cx="320" cy="100" r="5"/></g>
  <text x="180" y="185" fill="#1f3a5a" font-size="12">3 Small Areas · 900 people (60%)</text>
  <text x="300" y="185" fill="#7a5a00" font-size="12">2 Small Areas · 600 people (40%)</text>
  <text x="20" y="235" fill="#333" font-size="12">Homed under <tspan font-weight="600">Area A</tspan> (larger share). Area A's row is charged only its 900 people; the county's figure is charged all 1,500.</text>
  <text x="20" y="252" fill="#333" font-size="12">Area B's row gets nothing from this pin — so area person-hours always sum to ≤ the county's. Median dominant share in practice: 1.00.</text>
</svg>
