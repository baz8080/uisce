<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="system-ui, sans-serif" font-size="13">
  <!-- left: many pins each with a footprint circle, overlapping; right: one event with the unioned footprint -->
  <text x="160" y="26" text-anchor="middle" font-weight="600" fill="#7a3e00">As published: 13 pins, one reference number</text>
  <text x="480" y="26" text-anchor="middle" font-weight="600" fill="#1f3a5a">As counted: one event, footprint unioned</text>
  <!-- left cluster of overlapping circles -->
  <g fill="#f5d9c8" fill-opacity="0.45" stroke="#c0623a" stroke-width="1">
    <circle cx="110" cy="110" r="34"/><circle cx="140" cy="95" r="34"/><circle cx="170" cy="115" r="34"/><circle cx="125" cy="145" r="34"/><circle cx="160" cy="150" r="34"/><circle cx="195" cy="140" r="34"/><circle cx="90" cy="130" r="34"/>
    <circle cx="205" cy="105" r="34"/><circle cx="145" cy="175" r="34"/><circle cx="180" cy="180" r="34"/><circle cx="215" cy="170" r="34"/><circle cx="105" cy="170" r="34"/><circle cx="230" cy="135" r="34"/>
  </g>
  <g fill="#c0392b">
    <circle cx="110" cy="110" r="3"/><circle cx="140" cy="95" r="3"/><circle cx="170" cy="115" r="3"/><circle cx="125" cy="145" r="3"/><circle cx="160" cy="150" r="3"/><circle cx="195" cy="140" r="3"/><circle cx="90" cy="130" r="3"/>
    <circle cx="205" cy="105" r="3"/><circle cx="145" cy="175" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="215" cy="170" r="3"/><circle cx="105" cy="170" r="3"/><circle cx="230" cy="135" r="3"/>
  </g>
  <text x="160" y="232" text-anchor="middle" fill="#7a3e00" font-size="12">counted per pin: 13 events, each Small Area charged as often as circles reach it</text>
  <!-- arrow -->
  <path d="M290 135 L345 135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="317" y="125" text-anchor="middle" font-size="11" fill="#333">group by reference_num</text>
  <!-- right: one blob -->
  <path d="M400 95 C420 60, 500 55, 540 80 C585 100, 590 165, 555 195 C520 225, 440 225, 410 195 C380 170, 380 120, 400 95 Z" fill="#cfe3f5" fill-opacity="0.6" stroke="#3b6ea5" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" fill="#1f3a5a" font-weight="600">one event</text>
  <text x="480" y="158" text-anchor="middle" fill="#1f3a5a" font-size="12">time intervals unioned; each Small Area counted once;</text>
  <text x="480" y="174" text-anchor="middle" fill="#1f3a5a" font-size="12">population capped at the county's</text>
  <text x="480" y="232" text-anchor="middle" fill="#1f3a5a" font-size="12">LOU00112686: 13 pins in 22 minutes across Drogheda → 1 event</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
</svg>
