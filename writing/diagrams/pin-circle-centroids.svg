<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="system-ui, sans-serif" font-size="13">
  <!-- a pin, its 500 m circle, and Small Area centroids: those inside are counted, those outside are not -->
  <rect x="0" y="0" width="560" height="300" fill="#fafafa"/>
  <!-- faint grid = the 0.01° bins the index searches -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="140" y1="0" x2="140" y2="300"/><line x1="280" y1="0" x2="280" y2="300"/><line x1="420" y1="0" x2="420" y2="300"/>
    <line x1="0" y1="100" x2="560" y2="100"/><line x1="0" y1="200" x2="560" y2="200"/>
  </g>
  <!-- circle: 500 m -->
  <circle cx="280" cy="150" r="95" fill="#cfe3f5" fill-opacity="0.5" stroke="#3b6ea5" stroke-width="2"/>
  <line x1="280" y1="150" x2="375" y2="150" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="143" fill="#1f3a5a" font-size="12">500 m</text>
  <!-- the pin -->
  <path d="M280 120 l-9 18 a9 9 0 1 0 18 0 z" fill="#c0392b"/><circle cx="280" cy="129" r="4" fill="#fff"/>
  <text x="290" y="118" fill="#c0392b" font-weight="600">notice pin</text>
  <!-- centroids inside (counted): dark, with populations -->
  <g fill="#1f3a5a">
    <circle cx="255" cy="165" r="5"/><text x="240" y="185" font-size="11">266</text>
    <circle cx="300" cy="175" r="5"/><text x="305" y="192" font-size="11">195</text>
    <circle cx="245" cy="135" r="5"/><text x="222" y="130" font-size="11">258</text>
    <circle cx="315" cy="125" r="5"/><text x="322" y="120" font-size="11">311</text>
    <circle cx="335" cy="160" r="5"/><text x="342" y="176" font-size="11">219</text>
    <circle cx="225" cy="185" r="5"/><text x="205" y="205" font-size="11">279</text>
    <circle cx="340" cy="195" r="5"/><text x="348" y="212" font-size="11">352</text>
  </g>
  <!-- centroids outside (not counted): light -->
  <g fill="#b0b8c0">
    <circle cx="150" cy="80" r="5"/><circle cx="420" cy="90" r="5"/><circle cx="470" cy="210" r="5"/><circle cx="130" cy="240" r="5"/><circle cx="395" cy="250" r="5"/><circle cx="60" cy="150" r="5"/>
  </g>
  <text x="400" y="65" fill="#7a8088" font-size="12">centroid outside the circle:</text>
  <text x="400" y="80" fill="#7a8088" font-size="12">its whole Small Area is not counted</text>
  <text x="20" y="285" fill="#333" font-size="12">Each dot is the centre of one Census Small Area (50–200 households). The pin is assumed to affect every Small Area whose centre lies inside the circle; their populations are summed.</text>
</svg>
