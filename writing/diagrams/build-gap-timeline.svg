<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="system-ui, sans-serif" font-size="13">
  <!-- a timeline with build ticks; one long case observed Open then Closed; one short case that fits between two builds and is never observed open -->
  <line x1="30" y1="150" x2="580" y2="150" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="2">
    <line x1="80" y1="140" x2="80" y2="160"/><line x1="230" y1="140" x2="230" y2="160"/><line x1="380" y1="140" x2="380" y2="160"/><line x1="530" y1="140" x2="530" y2="160"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="80" y="180">build (Mon)</text><text x="230" y="180">build (Wed)</text><text x="380" y="180">build (Fri)</text><text x="530" y="180">build (Mon)</text>
  </g>
  <text x="305" y="215" text-anchor="middle" fill="#666">→ time; each tick is one download of the feed</text>
  <!-- long case: opens after Mon build, still Open at Wed, Closed by Fri -->
  <rect x="120" y="60" width="200" height="22" rx="4" fill="#cfe3f5" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="220" y="76" text-anchor="middle" fill="#1f3a5a">case A: open</text>
  <text x="120" y="52" fill="#1f3a5a" font-size="12">published</text>
  <circle cx="230" cy="71" r="5" fill="#3b6ea5"/><text x="240" y="60" fill="#1f3a5a" font-size="12">seen Open</text>
  <circle cx="380" cy="71" r="5" fill="#1f3a5a"/><text x="390" y="76" fill="#1f3a5a" font-size="12">seen Closed → closed_at = Fri</text>
  <text x="330" y="100" fill="#666" font-size="12">true close was somewhere in here: closed_at is observation time</text>
  <!-- short case: opens and closes between Wed and Fri, never seen open -->
  <rect x="270" y="112" width="70" height="20" rx="4" fill="#f5d9c8" stroke="#c0623a" stroke-width="1.5"/>
  <text x="305" y="126" text-anchor="middle" fill="#7a3e00" font-size="12">case B</text>
  <text x="440" y="126" fill="#7a3e00" font-size="12">← first seen already Closed: no transition, closed_at NULL</text>
</svg>
