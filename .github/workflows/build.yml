name: Build DB

on:
  schedule:
    # Twice daily, and the second slot is for publication latency ONLY — it is
    # not a data-quality measure. Notices publish between 07:00 and 16:00 UTC
    # (staffed office hours, see notes/data-quality.md), so a second build has
    # to land inside that window to do anything: measured over 8,135 cases, the
    # single evening build leaves a mean 7.7h from publication to the site,
    # a midday build halves that to 3.9h, and an overnight one would have
    # bought 0.9h. A third build takes 3.9h to 3.5h — not worth the run.
    #
    # Do NOT add builds to sharpen cases.closed_at, which is what the previous
    # version of this comment invited. Measured 2026-07-31: the feed marks a
    # case Closed a median of 76h after the works actually finished (97% more
    # than 24h later), so past a daily cadence the resolution floor is Uisce
    # Éireann's administrative lag, not our build gap — halving the gap moves
    # nothing a reader can see. On the same measurement the never-observed-open
    # rate is already down from 12% (the old Mon/Wed/Fri cron) to 1.9%.
    #
    # Scheduled runs land ~1h20 after the cron fires, so these hit ~12:45 and
    # ~18:45 UTC. The 6h spacing is far wider than the 1–3 minute run time.
    - cron: '20 11 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:
    inputs:
      replay_closed_at:
        description: >-
          Backfill cases.closed_at by replaying every published release DB.
          Off by default; needed once after the v2 schema lands, and again only
          if the DB is ever restored from an older release.
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# cases.closed_at is a one-shot observation: the feed carries only a case's
# current status, so a transition seen by a run that never publishes is lost for
# good. Two overlapping runs both download the same release DB and the later
# publish silently discards the earlier one's observations. The schedule alone
# cannot collide (6h apart, 1–3 minute runs) — this guards the real case, a
# manual dispatch landing on top of a scheduled run. Queue rather than cancel:
# a cancelled run has already read the feed and would lose the same way.
concurrency:
  group: build-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync

      - name: Download existing DB
        run: gh release download --pattern "uisce.db" --dir out/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline
        env:
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: uv run uisce-pipeline

      # Runs after the pipeline so the DB is already migrated to v2 and has this
      # build's own transitions stamped — the replay never overwrites those, and
      # they are the more precise value. The two together leave no gap: the
      # replay covers snapshot-to-snapshot, the pipeline's upsert covers the
      # last snapshot to now. Idempotent, so a repeat run is harmless.
      - name: Backfill closed_at from published snapshots
        if: ${{ inputs.replay_closed_at }}
        run: |
          mkdir -p snaps
          for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$TAG" --pattern uisce.db -O "snaps/$TAG.db" || true
          done
          uv run uisce-replay-closed-at --snapshots snaps --write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build inferred cases table
        run: uv run uisce-build-inferred

      - name: Publish DB
        run: |
          TAG="$(date +%Y-%m-%d)"
          gh release create "$TAG" out/uisce.db \
            --title "$TAG" \
            --notes "Data refresh" \
          || gh release upload "$TAG" out/uisce.db --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: uv run uisce-site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
