name: Build DB

on:
  schedule:
    # Twice daily, for publication latency ONLY — not to sharpen cases.closed_at.
    # See notes/data-quality.md ("Twice-daily builds: why, and why not three")
    # for the measured tradeoff. Runs land ~1h20 after the cron fires, hitting
    # ~12:45 and ~18:45 UTC.
    - cron: '20 11 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Guards against a manual dispatch landing on top of a scheduled run — two
# overlapping runs would silently discard one's closed_at observations. Queue
# rather than cancel: a cancelled run has already read the feed and would lose
# the same way. See notes/data-quality.md ("closed_at is a floor").
concurrency:
  group: build-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A dispatch from a branch would publish that branch's DB as the latest
      # release and push to main. Failed rather than skipped, so it is seen.
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Build DB publishes the latest release and pushes to main; dispatch it from main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Download existing DB
        run: |
          mkdir -p out
          gh release download --pattern "uisce.db" --dir out/ \
            || gh release download --pattern "uisce.db.next" -O out/uisce.db --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pipeline
        env:
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: uv run uisce-pipeline

      # The rules answer the templated ~93% here; the abstentions wait for a
      # local run with the LLM. See notes/rules-vs-llm-end-times.md.
      - name: Infer end times by rules
        run: uv run uisce-infer --rules-only

      - name: Build inferred cases table
        run: uv run uisce-build-inferred

      # A second build the same day replaces the asset. --clobber deletes the old
      # one before uploading, so the upload goes to uisce.db.next and only a
      # landed upload is swapped in. If a run dies between the delete and the
      # rename, the downloads fall back to uisce.db.next and the next run here
      # finishes the swap before it stages anything.
      - name: Publish DB
        run: |
          TAG="$(date +%Y-%m-%d)"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" out/uisce.db --title "$TAG" --notes "Data refresh"
            exit 0
          fi
          asset_id() {
            gh api "repos/{owner}/{repo}/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          rename() {
            gh api -X PATCH "repos/{owner}/{repo}/releases/assets/$1" -f name=uisce.db > /dev/null
          }
          OLD="$(asset_id uisce.db)"
          NEXT="$(asset_id uisce.db.next)"
          if [ -z "$OLD" ] && [ -n "$NEXT" ]; then
            rename "$NEXT"
          fi
          ln -f out/uisce.db out/uisce.db.next
          gh release upload "$TAG" out/uisce.db.next --clobber
          OLD="$(asset_id uisce.db)"
          NEXT="$(asset_id uisce.db.next)"
          if [ -n "$OLD" ]; then
            gh api -X DELETE "repos/{owner}/{repo}/releases/assets/$OLD"
          fi
          rename "$NEXT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the publish, so the committed JSONL never references a case the
      # latest release lacks (uisce-build-inferred refuses that combination).
      # Rebase before pushing: a local LLM run may have appended meanwhile, and
      # .gitattributes merges the two appends rather than conflicting.
      - name: Commit the inferred end times
        run: |
          git add data/inferred_end_times.jsonl
          if git diff --cached --quiet; then
            echo "no new inferences to commit"
            exit 0
          fi
          git -c user.name="uisce-ci" -c user.email="uisce-ci@users.noreply.github.com" \
            commit -q -m "Infer end times by rules, $(date -u +%Y-%m-%d) build"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
