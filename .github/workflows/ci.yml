name: CI

on:
  # Branches are covered by the pull_request trigger; push only runs for main.
  push:
    branches: [main]
    paths-ignore:
      - "notes/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "notes/**"
      - "**.md"

# A newer push to the same PR/branch supersedes the run in flight (never cancel main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Draft PRs skip CI until marked ready for review.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # checked with `uv lock --check` on 0.12.18; bump deliberately, with uv.lock
          version: "0.12.18"
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest
