[project]
name = "uisce"
version = "1.0.0"
description = "Download, transform, and geocode Uisce Éireann cases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
    "statusui",
]

[project.scripts]
uisce-pipeline = "uisce.pipeline:main"
uisce-backfill = "uisce.pipeline:backfill"
uisce-infer = "uisce.inference:run"
uisce-build-inferred = "uisce.build:run"
uisce-site = "uisce.site:run"
uisce-fetch-sa-pop = "uisce.sa_pop:run"
uisce-fetch-towns = "uisce.towns:run"
uisce-eval-sample = "uisce.eval_end_time:sample"
uisce-eval-sample-fresh = "uisce.eval_end_time:sample_fresh"
uisce-eval-score = "uisce.eval_end_time:score"
uisce-eval-replay = "uisce.eval_replay:run"
uisce-eval-rules-shadow = "uisce.eval_rules_shadow:run"
uisce-review-recurrence = "uisce.eval_recurrence:review"
uisce-eval-overlap = "uisce.eval_overlap:run"
uisce-score-recurrence = "uisce.eval_recurrence:score"
uisce-replay-closed-at = "uisce.replay_closed_at:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pinned to a commit in uv.lock; ../statusui/rollout.sh moves the pin.
[tool.uv.sources]
statusui = { git = "https://github.com/baz8080/statusui" }

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
